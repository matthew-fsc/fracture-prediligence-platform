# Fly.io — same-origin Docker deploy. Rename `app` after `fly launch`.
# Docs: https://fly.io/docs/reference/configuration/

app = "prediligence-replace-me"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

# Vite embeds these at image build time. Override: `fly deploy --build-arg VITE_CLERK_PUBLISHABLE_KEY=pk_live_...`
# Publishable key is public; must match Clerk instance used by CLERK_JWKS_URL on the server.
[build.args]
  VITE_CLERK_PUBLISHABLE_KEY = ""
  VITE_API_BASE_URL = ""

[env]
  PORT = "8000"
  # Set via `fly secrets set`: DATABASE_URL, SECRET_KEY, APP_ENV, CORS_ORIGINS, FRONTEND_URL, CLERK_JWKS_URL, ...

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
