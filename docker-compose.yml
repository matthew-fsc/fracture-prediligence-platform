# Local production-like stack: Postgres + API serving built SPA + /api on one port.
# Usage: from this directory (where docker-compose.yml lives):
#   docker compose up --build
#   open http://localhost:8000
#
# Set DATABASE_URL, secrets, and APP_ENV=production in a compose override or `.env` for real deployments.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: prediligence
    ports:
      - "5432:5432"
    volumes:
      - prediligence_pg:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Public Clerk key + optional split-API origin (see frontend/.env.example)
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@db:5432/prediligence
      SECRET_KEY: "${SECRET_KEY:-change-me-in-production-generate-with-openssl-rand-hex-32}"
      CORS_ORIGINS: http://localhost:8000
      FRONTEND_URL: http://localhost:8000
      RUN_MIGRATIONS: "true"
      PORT: "8000"
    depends_on:
      - db

volumes:
  prediligence_pg:
