# Optional: deploy same-origin Docker image to Fly.io (manual trigger).
# Repository secrets: FLY_API_TOKEN (https://fly.io/docs/flyctl/tokens/)

name: Deploy Fly.io

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Optional: add repo secret VITE_CLERK_PUBLISHABLE_KEY so the remote build embeds Clerk in the SPA.
      - name: Deploy
        run: |
          if [ -n "${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}" ]; then
            flyctl deploy --remote-only \
              --build-arg "VITE_CLERK_PUBLISHABLE_KEY=${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}"
          else
            flyctl deploy --remote-only
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
